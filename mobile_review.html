<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RCK Development — Mobile Preview</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#F0EDE8;font-family:Helvetica,Arial,sans-serif}
  .stage{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:40px 24px;
    background:linear-gradient(135deg,#EDEAE3 0%,#E4DFD6 100%);
  }
  .label{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.12em;text-transform:lowercase;
    color:#888;background:rgba(255,255,255,.7);
    backdrop-filter:blur(8px);
    padding:6px 14px;border-radius:999px;border:1px solid #ddd;
    white-space:nowrap;
  }
</style>
</head>
<body>
<div class="stage" id="root"></div>
<script type="text/babel">
const { useState } = React;

function App() {
  return (
    <div className="stage">
      <span className="label">rck development — mobile preview</span>
      <IOSDevice
        width={390}
        height={844}
      >
        <iframe
          src="RCK Development.html"
          style={{width:'100%',height:'100%',border:'none',display:'block'}}
          title="RCK Development mobile preview"
        />
      </IOSDevice>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
